[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eightball-console"
version = "0.1.0"
description = "8-Ball standalone console: host profile, Happy Nerds menu and native-Ollama model jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[project.scripts]
eightball-console = "eightball_console.__main__:main"

[tool.setuptools]
packages = ["eightball_console"]

[tool.setuptools.package-data]
eightball_console = ["static/*", "data/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
