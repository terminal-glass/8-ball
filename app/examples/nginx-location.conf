# Example: publish the console same-origin under /apps/8ball/ on an existing TLS server block.
# Authentication happens here (auth_basic shown); nginx then tells the console who the user is.
location = /apps/8ball { return 301 /apps/8ball/; }
location /apps/8ball/tty/ {
    auth_basic "8-Ball";
    auth_basic_user_file /etc/nginx/8ball.htpasswd;
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}
location /apps/8ball/ {
    auth_basic "8-Ball";
    auth_basic_user_file /etc/nginx/8ball.htpasswd;
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-8Ball-User $remote_user;
    proxy_set_header X-8Ball-Role admin;
    proxy_set_header Authorization "";
    proxy_buffering off;          # server-sent events
    proxy_read_timeout 1h;
}
