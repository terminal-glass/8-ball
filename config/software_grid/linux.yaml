    cloud_option: {primary: jet-llama, provider: meta, endpoint: TBD, model_id: TBD}
    scheduler: {engine: cron, verified_by: stage 50 check - not yet measured}
    services:
      nginx: {installed: true, bind: LAN}
      openclaw_gateway: {installed: true}
      gridstack_workspace: {installed: true}
      wekan: {installed: true, status: core}
      silverbullet: {installed: true}
      kiwix: {installed: true, zim_tier: medium or full by free disk}
      dokuwiki: {installed: true}
      mailpit: {installed: true, cap: 512M}
      openwebui_tool_bridge: {installed: true}
      ollama: {installed: true}
      tailscale: {installed: optional, use: remote access via Serve}
    docker: true
    open_webui: {installed: true, image: full, method: Docker, can_be_turned_off: stage3.free_ram}
    notes: {remote: LAN-only by default; Tailscale gives remote users the same interfaces., status: unmeasured}
    dropped: [llama3:8b, standard stage 3 as the default]
    measured: false

  - level: 6
    hardware_profile_ref: 'config/hardware_scale.yaml#level-6'
    ui: GridStack workspace; Open WebUI main chat plus Claw Chat tile
    chat_frontend: both
    stage3_variant: '3'
    stage3_options: ['3', '3-ram2', '3-ram1']
    consultation: {runner: local llama, model: 'llama3:8b', fallback: jet-llama}
    local_models:
      canary: null
      llama: llama3:8b
      qwen: qwen2.5-coder:7b   # tentative
      embedding: nomic-embed-text (tentative)
      ollama_env: {OLLAMA_MAX_LOADED_MODELS: 2, OLLAMA_NUM_PARALLEL: 2}
      num_ctx: 8192
    cloud_option: {primary: jet-llama, provider: meta, endpoint: TBD, model_id: TBD}
    scheduler: {engine: cron, verified_by: stage 50 check - not yet measured}
    services:
      nginx: {installed: true, bind: LAN}
      openclaw_gateway: {installed: true}
      gridstack_workspace: {installed: true}
      wekan: {installed: true, status: core}
      silverbullet: {installed: true}
      kiwix: {installed: true, zim_tier: by free disk, up to full}
      dokuwiki: {installed: true}
      mailpit: {installed: true}
      openwebui_tool_bridge: {installed: true}
      ollama: {installed: true}
