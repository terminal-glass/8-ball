    stage3_variant: '3'
    stage3_options: ['3', '3-ram2', '3-ram1']
    consultation: {runner: local llama, model: 'llama3:8b', fallback: jet-llama}
    local_models:
      canary: null
      llama: llama3:8b
      qwen: qwen2.5-coder:7b   # tentative
      embedding: nomic-embed-text (tentative)
      gpu: CUDA, multi-GPU (OLLAMA_SCHED_SPREAD=1, tentative)
      ollama_env: {OLLAMA_MAX_LOADED_MODELS: 4, OLLAMA_NUM_PARALLEL: 8}
