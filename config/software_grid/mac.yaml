        bind: 127.0.0.1:11434
        source: 1.0.27-MAC stage 2
      - name: colima
        launchd: "`brew services start colima` as the user"
        source: 1.0.27-MAC stage 1
      - name: open-webui
        launchd: none (Docker container in Colima, restart unless-stopped)
        bind: 127.0.0.1:3000
        source: 1.0.27-MAC stage 3
      - name: gridstack-workspace45
        launchd: com.terminalglass.workspace45
        bind: 127.0.0.1:8845
        source: Mac 45.sh
      - name: openclaw-control-ui
        launchd: none (served by the OpenClaw gateway)
        note: GridStack tile "Claw Chat"
    docker:
      runtime: colima
      vm_memory_gib: 2
      vm_cpus: 2
      note: Colima defaults (2 CPU, 2 GiB). Homebrew installs Colima as the user, never as root.
    stage3_variant: "3-ram2"
    open_webui:
      enabled: true
      image: open-webui slim variant, pinned by digest (digest TODO)
      mem_limit: 1g
      embeddings: Ollama (no in-process embedding or Whisper models)
      free_ram_setting:
        default: open_webui_on
        run_as: logged-in user, never root (no sudo, no root Homebrew)
        turn_off: stop the Open WebUI container, then `colima stop`. The OpenClaw gateway and its Control UI chat keep running, and the shared chat database is left in place.
        turn_on: run `colima start`, then start the Open WebUI container again. It reopens the same shared database.
        persistence: the choice is stored in the user's home with the other 8-ball settings (directory 0700, file 0600) and survives reboots.
    dropped:
      - canary tinyllama:1.1b (replaced by llama3.2:1b)
      - Open WebUI full image (slim only)
      - DokuWiki (stage 5)
      - SilverBullet (stage 34) by default; opt-in
      - 8-Ball console LaunchAgent by default; opt-in
      - PhilosopherOS add-ons (21, 31, 32, 35)
      - Nextcloud (stage 33)
      - Kiwix Planet Library (not ported to Mac yet)
    notes:
      - "stage3_variant 3-ram2: slim Open WebUI and OpenClaw chat side by side on one shared database, on by default. The user can turn Open WebUI and Colima off to free RAM (see open_webui.free_ram_setting)."
      - Every 8 GB Apple Silicon Mac (M1, M2, M3 base models) lands here, so this is the most common Mac level.
      - Open WebUI is on by default because Jonathan asked for Mac on Open WebUI. The lite-stack plan drops it at levels 0-2; see open questions.
      - Tailscale (stage 12) is opt-in.
      - Not an App Store candidate.
