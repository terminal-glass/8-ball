# macOS column of the shared per-OS software grid (levels 0-9).
# Shared schema: config/software_grid/README.md (owned by Leonardo).
# Linux: linux.yaml (Leonardo). Windows: windows.yaml (Raphael). Mac: this file (Monet).
#
# DRAFT. Nothing here has run on a real Mac (Apple Silicon or Intel); measured is false everywhere.
# Hardware levels, RAM bands and model tags come from config/hardware_scale.yaml and are not changed here.
# Mac RAM placement uses eight_ball.scale.place_by_ram (min inclusive, max exclusive, decimal bytes):
#   4 GiB -> 1, 8 GiB -> 2, 16/18 GiB -> 4, 24 GiB -> 5, 32/36/48 GiB -> 6,
#   64/96 GiB -> 7, 128/192 GiB -> 8, 256/512 GiB -> 9. No current Mac lands on level 0 or 3.
#
# Standing Mac rules that apply to every level:
#   - Homebrew is never run as root. Every installer step runs as the logged-in user.
#   - Generated credentials go only in the installing user's home (directories 0700, files 0600), never /root.
#   - Services are user LaunchAgents in ~/Library/LaunchAgents (scheduler: launchd). No cron, systemd, snap or apt.
#   - Ollama listens on 127.0.0.1:11434; it is never exposed on the tailnet or internet.
#   - Installer stage and script numbers are never renumbered or aliased.
#   - The ai-link Mac stays separate: no PhilosopherOS, WeKan or benchmark tools on it.
#   - Mac App Store packaging is commercial tier only and separate from the pilot. It is not planned in this grid.
# stage3_variant (required, shared schema): 3 = standard Open WebUI, 3-ram1 = low-RAM, OpenClaw chat only,
#   3-ram2 = Open WebUI and OpenClaw chat side by side on one shared database plus a user setting that turns
#   Open WebUI and Colima off to free RAM. These are names only; no installer scripts are created or renumbered here.
# The optional key `dropped` lists what is removed at that level compared with the full Mac stack.
schema_ref: config/software_grid/README.md
os: mac
owner: monet
status: draft
scale_ref: config/hardware_scale.yaml
sources:
  - ycgpt-lightsail-installer 1.0.27-MAC-PhilosopherOS-BETA (stages 0-6, 10-12, 21, 31, 32, 34, 35, 50)
  - ycgpt-lightsail-installer branch feat/ai-link-mac-gridstack-8ball-20261101 (Mac 45.sh GridStack, 8-2.sh 8-Ball console)
  - ycgpt-lightsail-installer branch cursor/osamp-9ball-beta-49c4, folder 1.0.39-MAC-9BALL-BETA (Mac 9-Ball)
  - ycgpt-lightsail-installer PROD-1.0.11-MAC (stage map reference)
  - lite-stack plan (OpenClaw Control UI + GridStack for levels 0-3), 2026-11-13
levels:
  - level: 0
    hardware_profile_ref: config/hardware_scale.yaml#level-0
    ui: see linux.yaml level 0
    chat_frontend: see linux.yaml level 0
    consultation: see linux.yaml level 0
    local_models: see linux.yaml level 0
    cloud_option: see linux.yaml level 0
    scheduler: launchd
    services: []
    docker: see linux.yaml level 0
    stage3_variant: "3-ram1"
    open_webui: see linux.yaml level 0
    notes:
      - "stage3_variant 3-ram1 mirrors Leonardo's linux.yaml level 0 (consultation stack, OpenClaw chat only); his entry is authoritative."
      - Placeholder. Level 0 is the consultation stack owned by Leonardo; this entry mirrors linux.yaml level 0.
      - No Mac that runs a supported macOS has less than 4 GB, so no Mac is expected on level 0.
    measured: false

  - level: 1
    hardware_profile_ref: config/hardware_scale.yaml#level-1
    ui: gridstack-workspace45
    chat_frontend: openclaw-control-ui
    consultation:
      runner: canary
      model: tinyllama:1.1b
      fallback: openclaw (only if canary is too large and OpenClaw is capable; adapter planned, not implemented)
    local_models:
      primary: tinyllama:1.1b
      code_focus: null
      load_policy: on demand only; OLLAMA_MAX_LOADED_MODELS=1, OLLAMA_NUM_PARALLEL=1, short OLLAMA_KEEP_ALIVE
    cloud_option:
      id: jet-llama
      provider: meta
      credential: customer's own Meta API key in ~/.config/8-ball/meta-api-key (dir 0700, file 0600)
      grok: false
    scheduler: launchd
    services:
      - name: openclaw-gateway
        launchd: user LaunchAgent created by `openclaw gateway install`
        bind: 127.0.0.1:18789
        source: 1.0.27-MAC stage 11 / 1.0.39 9-Ball (sits beside an existing OpenClaw)
      - name: ollama
        launchd: Ollama.app login item, or `brew services start ollama` as the user
        bind: 127.0.0.1:11434
        source: 1.0.27-MAC stage 2
      - name: gridstack-workspace45
        launchd: com.terminalglass.workspace45
        bind: 127.0.0.1:8845
        source: Mac 45.sh (Python server mac-workspace45.py)
    docker:
      runtime: none
    stage3_variant: "3-ram1"
    open_webui:
      enabled: false
    dropped:
      - Open WebUI (no Docker at this level; chat is the OpenClaw Control UI tile)
      - Colima / Docker
      - DokuWiki (stage 5, Docker on Mac)
      - SilverBullet (stage 34, Docker on Mac)
      - 8-Ball console LaunchAgent (com.terminalglass.eightball)
      - Tailscale (stage 12) by default; opt-in only
      - PhilosopherOS add-ons (21 recording, 31 Hermes, 32 WeKan/task API, 35 GitHub)
      - Nextcloud (stage 33 is omitted on Mac at every level)
      - Kiwix Planet Library (not ported to Mac yet)
      - Qwen code model (too large next to OpenClaw on 4 GB)
    notes:
      - "stage3_variant 3-ram1: low-RAM option. Skips Open WebUI and goes straight to the OpenClaw Control UI chat. No Colima."
      - 9-Ball tier. Mirrors 1.0.39-MAC-9BALL-BETA, which runs as the user, refuses root and never calls Homebrew.
      - Only older Intel Macs with 4 GB (for example 2014-2017 MacBook Air or Mac mini) land here. No Apple Silicon Mac does.
      - Intel Macs have no Metal acceleration in Ollama, so local inference is CPU only and slow. The cloud jet is the main brain.
      - Many 4 GB Intel Macs cannot run a macOS version that current Ollama and OpenClaw (Node 24) support. Treat as best effort.
      - Not an App Store candidate.
    measured: false

  - level: 2
    hardware_profile_ref: config/hardware_scale.yaml#level-2
