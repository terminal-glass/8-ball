    stage3_variant_reason: Slim Open WebUI on by default at 8 GB (approved by Jonathan). The free-RAM setting turns
      Open WebUI and Colima off; 3-ram1 is offered for users who never want Open WebUI.
    stage3_scripts:
      3-ram2: 3-ram2.sh
      3-ram1: 3-ram1.sh
