profiles:
  - id: cpu-small
    display_name: Small CPU system
    system_ram_gb: 8
    vram_gb: 0
    cpu_only: true
    notes: Laptop or small VM without discrete GPU
  - id: desktop-standard
    display_name: Standard desktop or server
    system_ram_gb: 16
    vram_gb: 0
    cpu_only: true
    notes: Typical developer workstation, CPU inference
  - id: server-high-mem
    display_name: High-memory CPU server
    system_ram_gb: 64
    vram_gb: 0
    cpu_only: true
    notes: Large RAM server for bigger quantized models on CPU
  - id: gpu-entry
    display_name: Entry GPU
    system_ram_gb: 16
    vram_gb: 8
    cpu_only: false
    notes: 8 GB VRAM class GPU
  - id: gpu-midrange
    display_name: Midrange GPU
    system_ram_gb: 32
    vram_gb: 16
    cpu_only: false
    notes: 16 GB VRAM class GPU
  - id: gpu-high-mem
    display_name: High-memory GPU
    system_ram_gb: 64
    vram_gb: 24
    cpu_only: false
    notes: 24 GB VRAM class GPU
  - id: multi-gpu
    display_name: Multi-GPU
    system_ram_gb: 128
    vram_gb: 48
    cpu_only: false
    notes: Multi-GPU or very large single-GPU workstation
  - id: cloud-only
    display_name: Cloud-only model access
    system_ram_gb: 8
    vram_gb: 0
    cpu_only: true
    notes: Client device for cloud API access only
