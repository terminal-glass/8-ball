name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
      - name: Validate sample catalog offline
        run: |
          eight-ball normalize --fixture --offline
          eight-ball validate --fixture --offline
          eight-ball generate --fixture --offline
