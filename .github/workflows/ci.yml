name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
      - name: Validate sample catalog offline
        run: |
          eight-ball all --fixture --offline --sample
      - name: Reject invalid catalog and contribution records
        run: bash scripts/validate-catalog.sh
      - name: ShellCheck experimental model manager
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install/shared/8.4a-model-manager.sh
          shellcheck install/shared/8.4a-model-manager.sh
